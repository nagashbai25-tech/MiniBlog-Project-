events {
}

http {
    gzip on;
    gizip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gizip_min_length 1000;
    server { 
        listen 80;
        
        return 301 https://$host$request_uri; 
    }
    server {
        listen 443;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        location / {
            proxy_pass http://apps:2000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr; 
            
            
        }
        location /static/ {`
            alias /usr/share/nginx/html/static/; 
        }
    
    }

}
