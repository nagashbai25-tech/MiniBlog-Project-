services: 
  app: 
    build: front/.
    container_name: app
    ports: 
      - "5000:5000"
    depends_on: 
      database:
        condition: service_healthy

  database:
    image: postgres:16
    restart: always
    container_name: database
    environment:
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_password}
      POSTGRES_DB: ${db_name}
    ports: 
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${db_user} -d ${db_name}"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes: 
  postgres_data: 