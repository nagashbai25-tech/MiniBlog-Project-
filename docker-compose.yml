services: 
  app: 
    build: front/.
    container_name: app
    expose:
      - "5000"
    environment: 
      POSTGRES_URL: ${database} 
    depends_on: 
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  nginx:
    image: nginx:alpine
    container_name: nginxs
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/data:/data:ro
    depends_on:
      - app
    

  database:
    image: postgres:16
    restart: always
    container_name: database
    environment:
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_password}
      POSTGRES_DB: ${db_name}
    ports: 
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${db_user} -d ${db_name}"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes: 
  postgres_data: 