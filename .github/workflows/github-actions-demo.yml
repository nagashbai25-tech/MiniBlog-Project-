
name: ga demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      

      - name: check files
        run: ls -la 

      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: front/requirements.txt

      - name: Install dependencies
        run: pip install -r front/requirements.txt